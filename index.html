<!doctype html>
<html lang="ja" data-app-version="24">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<title>家トレ減量 30DAYS</title>
<style>
:root{
  --navy:#0b1f3a;--green:#16a36c;--green2:#e9f8f1;--blue:#49a8f2;--blue2:#edf7ff;
  --pink:#f06b92;--pink2:#fff0f5;--ink:#10203b;--muted:#718096;--line:#e7ebf1;--bg:#f4f7fb;
}
*{box-sizing:border-box}
html,body{margin:0;background:#eef2f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button{font:inherit;border:0}
.app{width:min(100%,520px);min-height:100dvh;margin:auto;background:#fff;padding-bottom:88px;overflow:hidden}
.top{padding:18px 20px 14px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px}.logo b{color:#f2b72b}.v{font-size:11px;color:#9aa5b5}
main{padding:18px}
.screen{display:none}.screen.active{display:block}
h1,h2,h3,p{margin-top:0}
.eyebrow{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px}
.title{font-size:30px;line-height:1.1;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px;line-height:1.55}
.card{border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 8px 28px rgba(17,34,68,.05)}
.hero{padding:20px;background:linear-gradient(145deg,#0b1f3a,#17365f);color:#fff;margin-bottom:16px}
.hero .sub{color:#d9e4f3}.heroRow{display:flex;justify-content:space-between;gap:18px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#20b476 0 12%,rgba(255,255,255,.18) 12% 100%);position:relative;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#102a4b}.ring span{position:relative;z-index:1;font-weight:900;font-size:22px}.ring small{font-size:10px;font-weight:700}
.sectionTitle{font-size:18px;margin:18px 0 10px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{aspect-ratio:1;border-radius:12px;background:#f5f7fa;display:grid;place-items:center;font-weight:800;font-size:13px;color:#526078}
.day.done{background:var(--green2);color:var(--green)}.day.today{background:var(--green);color:#fff;box-shadow:0 5px 16px rgba(22,163,108,.25)}
.cta{width:100%;padding:16px 18px;border-radius:16px;background:var(--green);color:#fff;font-weight:900;font-size:17px;margin-top:16px}
.secondary{width:100%;padding:14px;border-radius:14px;background:#f4f6f9;color:var(--ink);font-weight:800;margin-top:10px}
.planGrid{display:grid;gap:13px}
.plan{padding:18px;text-align:left;position:relative;overflow:hidden;border-radius:24px}
.plan.blue{background:var(--blue2);border:1px solid #dbeefe}.plan.pink{background:var(--pink2);border:1px solid #ffe0e9}
.planTag{font-size:12px;font-weight:900;letter-spacing:.06em}.blue .planTag{color:#2389d3}.pink .planTag{color:#d84d75}
.plan h2{font-size:23px;margin:4px 0 6px}.plan p{font-size:13px;color:#61718a;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.exerciseList{display:grid;gap:9px;margin-top:16px}
.exerciseItem{display:flex;align-items:center;gap:12px;padding:10px;background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,.05)}
.exerciseItem img{width:68px;height:68px;object-fit:cover;border-radius:13px;background:#f2f4f7}
.exerciseItem b{display:block;font-size:14px}.exerciseItem span{font-size:12px;color:var(--muted)}
.back{background:none;color:var(--ink);font-weight:900;padding:0;margin-bottom:14px}
.workTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.workTop b{font-size:16px}.workTop span{font-weight:900}
.progress{height:7px;border-radius:99px;background:#e8ecf1;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;background:var(--green);width:20%;transition:.25s}
.workTitle{text-align:center;font-size:31px;margin-bottom:4px}.target{text-align:center;font-size:48px;line-height:1;font-weight:950;color:var(--green);margin:0 0 14px}
.visual{height:430px;border-radius:26px;overflow:hidden;background:#f3f5f7;border:1px solid var(--line);position:relative}
.visual img{width:100%;height:100%;object-fit:contain;display:block}
.guideBadge{position:absolute;right:12px;top:12px;background:var(--navy);color:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900}
.tip{margin:13px 0 0;padding:14px 15px;border-radius:18px;background:#f0faf5;line-height:1.55;font-size:14px}
.countbox{text-align:center;padding:16px 0 4px}.count{font-size:44px;font-weight:950}.count small{font-size:16px;color:var(--muted)}
.sessionBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.sessionBtns button{padding:14px;border-radius:14px;font-weight:900}.pause{background:#f2f4f7}.next{background:var(--green);color:#fff}
.restWrap{text-align:center;padding-top:45px}.restCircle{width:220px;height:220px;border-radius:50%;margin:22px auto;display:grid;place-items:center;background:conic-gradient(var(--green) var(--rest),#e9edf2 0);position:relative}
.restCircle:after{content:"";position:absolute;inset:14px;background:#fff;border-radius:50%}.restNum{position:relative;z-index:1;font-size:64px;font-weight:950}.nextCard{display:flex;align-items:center;gap:14px;padding:12px;text-align:left;margin-top:24px}.nextCard img{width:84px;height:84px;border-radius:16px;object-fit:cover}.nextCard small{color:var(--muted)}.nextCard b{display:block;font-size:18px;margin-top:3px}
.doneBox{text-align:center;padding:42px 20px 20px}.check{width:104px;height:104px;border-radius:50%;background:var(--green2);color:var(--green);display:grid;place-items:center;margin:0 auto 18px;font-size:52px;font-weight:950}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.stat{padding:14px 6px;background:#f5f7fa;border-radius:16px}.stat b{display:block;font-size:21px}.stat small{color:var(--muted);font-size:11px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:76px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav button{background:none;color:#718096;font-size:11px;font-weight:800}.nav button b{display:block;font-size:20px;color:var(--ink);margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#10203b;color:#fff;padding:11px 15px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:390px){main{padding:14px}.visual{height:365px}.title{font-size:27px}.target{font-size:43px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="logo">🏋️ 家トレ減量 <b>30 DAYS</b></div><div class="v">v24</div></header>

  <main>
    <section id="home" class="screen active">
      <div class="card hero">
        <div class="heroRow">
          <div><div class="eyebrow" style="color:#b9cae0">TODAY</div><h1 class="title">Day <span id="dayNo">1</span></h1><p class="sub">今日の分だけ。終わったらカレンダーに記録。</p></div>
          <div class="ring"><span><span id="doneDays">0</span><small>/30</small></span></div>
        </div>
      </div>
      <h2 class="sectionTitle">30日カレンダー</h2>
      <div id="calendar" class="calendar"></div>
      <button class="cta" onclick="showScreen('plans')">今日のトレーニングを開始</button>
    </section>

    <section id="plans" class="screen">
      <button class="back" onclick="showScreen('home')">← 戻る</button>
      <div class="eyebrow">TODAY'S WORKOUT</div><h1 class="title">メニューを選択</h1><p class="sub">AとBを交互に進めればOK。</p>
      <div class="planGrid">
        <button class="plan blue" onclick="selectPlan('A')">
          <div class="planTag">A MENU</div><h2>下半身メイン</h2><p>脚・お尻・体幹を中心に5種目</p>
          <div class="chips"><span class="chip">5種目</span><span class="chip">約12分</span></div>
        </button>
        <button class="plan pink" onclick="selectPlan('B')">
          <div class="planTag">B MENU</div><h2>全身バランス</h2><p>上半身も含めて全身を5種目</p>
          <div class="chips"><span class="chip">5種目</span><span class="chip">約12分</span></div>
        </button>
      </div>
      <div id="previewList" class="exerciseList"></div>
    </section>

    <section id="workout" class="screen">
      <div class="workTop"><button class="back" style="margin:0" onclick="quitWorkout()">← 終了</button><b id="stepText">1 / 5</b></div>
      <div class="progress"><i id="progressBar"></i></div>
      <h1 id="exerciseName" class="workTitle">スクワット</h1>
      <div id="exerciseTarget" class="target">15回</div>
      <div class="visual"><img id="exerciseImg" alt=""><div class="guideBadge">フォームを見ながら実行</div></div>
      <div id="exerciseTip" class="tip"></div>
      <div class="countbox"><span id="count" class="count">0<small> / 15</small></span></div>
      <div class="sessionBtns"><button id="pauseBtn" class="pause" onclick="togglePause()">一時停止</button><button class="next" onclick="finishExercise()">完了 →</button></div>
    </section>

    <section id="rest" class="screen">
      <div class="restWrap">
        <div class="eyebrow">REST</div><h1 class="title">45秒休憩</h1><p class="sub">呼吸を整えて、次の種目へ。</p>
        <div id="restCircle" class="restCircle" style="--rest:100%"><span id="restNum" class="restNum">45</span></div>
        <div class="card nextCard"><img id="nextImg" alt=""><div><small>次の種目</small><b id="nextName"></b><span id="nextTarget" class="sub"></span></div></div>
        <button class="secondary" onclick="skipRest()">休憩をスキップ</button>
      </div>
    </section>

    <section id="complete" class="screen">
      <div class="doneBox">
        <div class="check">✓</div><div class="eyebrow">COMPLETE</div><h1 class="title">今日のトレーニング完了！</h1><p class="sub">記録を30日カレンダーに保存した。</p>
        <div class="stats"><div class="stat"><b>5</b><small>種目</small></div><div class="stat"><b>約12</b><small>分</small></div><div class="stat"><b id="streak">1</b><small>連続日</small></div></div>
        <button class="cta" onclick="showScreen('home')">カレンダーを見る</button>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button onclick="showScreen('home')"><b>⌂</b>ホーム</button>
    <button onclick="showScreen('plans')"><b>▦</b>メニュー</button>
    <button onclick="resetData()"><b>↺</b>記録リセット</button>
  </nav>
</div>
<div id="toast" class="toast"></div>

<script>
const plans={
A:[
 {name:"スクワット",target:"15回",max:15,kind:"reps",img:"squat.jpg",tip:"💡 胸を起こしたまま、お尻を後ろへ。膝とつま先は同じ方向。"},
 {name:"ワイドスクワット",target:"15回",max:15,kind:"reps",img:"wide_squat.jpg",tip:"💡 足を広めに。つま先を少し外へ向け、膝も同じ方向へ。"},
 {name:"バックランジ",target:"左右 各12回",max:24,kind:"reps",img:"back_lunge.jpg",tip:"💡 片脚を真後ろへ引き、上体を立てたまま真下へ沈む。"},
 {name:"ヒップリフト",target:"15回",max:15,kind:"reps",img:"hip_bridge_a.jpg",tip:"💡 かかとで床を押し、お尻を締めながらゆっくり上げ下げ。"},
 {name:"プランク",target:"30秒",max:30,kind:"seconds",img:"plank.jpg",tip:"💡 頭からかかとまで一直線。腰を反らさず30秒キープ。"}
],
B:[
 {name:"サイドランジ",target:"左右 各12回",max:24,kind:"reps",img:"side_lunge.jpg",tip:"💡 横へ大きく踏み、踏み出した側のお尻を後ろへ。"},
 {name:"腕立て伏せ",target:"12回",max:12,kind:"reps",img:"pushup.jpg",tip:"💡 頭からかかとまで一直線。きつければ膝をついてOK。"},
 {name:"バードドッグ",target:"左右 各12回",max:24,kind:"reps",img:"bird_dog.jpg",tip:"💡 右手＋左脚、左手＋右脚をまっすぐ伸ばす。"},
 {name:"ヒップアブダクション",target:"左右 各15回",max:30,kind:"reps",img:"hip_abduction.jpg",tip:"💡 横向きで体を一直線にし、上の脚を反動なしで上げ下げ。"},
 {name:"サイドプランク",target:"左右 各30秒",max:60,kind:"seconds",img:"side_plank.jpg",tip:"💡 肩の真下に肘。腰を落とさず一直線をキープ。"}
]};
let planKey="A",idx=0,count=0,timer=null,paused=false,restTimer=null,restLeft=45;
const $=id=>document.getElementById(id);

function showScreen(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 $(id).classList.add("active");
 if(id==="home") renderHome();
 if(id==="plans") renderPreview();
 window.scrollTo({top:0,behavior:"instant"});
}
function renderHome(){
 const today=new Date(), startKey="ietoreStartDate";
 let start=localStorage.getItem(startKey);
 if(!start){start=today.toISOString().slice(0,10);localStorage.setItem(startKey,start)}
 const startDate=new Date(start+"T00:00:00");
 const day=Math.min(30,Math.max(1,Math.floor((today-startDate)/86400000)+1));
 $("dayNo").textContent=day;
 const done=JSON.parse(localStorage.getItem("ietoreDone")||"[]");
 $("doneDays").textContent=done.length;
 const cal=$("calendar");cal.innerHTML="";
 for(let i=1;i<=30;i++){const d=document.createElement("div");d.className="day"+(done.includes(i)?" done":"")+(i===day?" today":"");d.textContent=i;cal.appendChild(d)}
}
function renderPreview(){
 const list=$("previewList");list.innerHTML="";
 ["A","B"].forEach(k=>{
   plans[k].forEach((e,i)=>{
     const div=document.createElement("div");div.className="exerciseItem";
     div.innerHTML=`<img src="${e.img}" alt=""><div><b>${k}${i+1}. ${e.name}</b><span>${e.target}</span></div>`;
     list.appendChild(div);
   })
 })
}
function selectPlan(k){planKey=k;idx=0;count=0;showScreen("workout");loadExercise()}
function loadExercise(){
 clearTimers();paused=false;$("pauseBtn").textContent="一時停止";
 const ex=plans[planKey][idx];
 $("stepText").textContent=`${idx+1} / ${plans[planKey].length}`;
 $("progressBar").style.width=`${((idx+1)/plans[planKey].length)*100}%`;
 $("exerciseName").textContent=ex.name;$("exerciseTarget").textContent=ex.target;
 $("exerciseImg").src=ex.img;$("exerciseTip").textContent=ex.tip;count=0;updateCount();
 const speed=ex.kind==="seconds"?1000:2200;
 timer=setInterval(()=>{if(paused)return;if(count<ex.max){count++;updateCount()}else finishExercise()},speed);
}
function updateCount(){
 const ex=plans[planKey][idx],unit=ex.kind==="seconds"?"秒":"";
 $("count").innerHTML=`${count}${unit}<small> / ${ex.max}${unit}</small>`;
}
function togglePause(){paused=!paused;$("pauseBtn").textContent=paused?"再開":"一時停止"}
function finishExercise(){
 clearTimers();
 if(idx>=plans[planKey].length-1){completeWorkout();return}
 restLeft=45;const next=plans[planKey][idx+1];
 $("nextImg").src=next.img;$("nextName").textContent=next.name;$("nextTarget").textContent=next.target;
 showScreen("rest");renderRest();
 restTimer=setInterval(()=>{restLeft--;renderRest();if(restLeft<=0)skipRest()},1000)
}
function renderRest(){
 $("restNum").textContent=restLeft;
 $("restCircle").style.setProperty("--rest",`${(restLeft/45)*100}%`);
}
function skipRest(){clearInterval(restTimer);restTimer=null;idx++;showScreen("workout");loadExercise()}
function completeWorkout(){
 const today=new Date(),start=new Date((localStorage.getItem("ietoreStartDate")||today.toISOString().slice(0,10))+"T00:00:00");
 const day=Math.min(30,Math.max(1,Math.floor((today-start)/86400000)+1));
 let done=JSON.parse(localStorage.getItem("ietoreDone")||"[]");if(!done.includes(day))done.push(day);done.sort((a,b)=>a-b);localStorage.setItem("ietoreDone",JSON.stringify(done));
 let streak=0;for(let i=day;i>=1;i--){if(done.includes(i))streak++;else break}$("streak").textContent=streak;
 showScreen("complete")
}
function quitWorkout(){clearTimers();showScreen("plans")}
function clearTimers(){if(timer)clearInterval(timer);timer=null;if(restTimer)clearInterval(restTimer);restTimer=null}
function resetData(){if(confirm("30日カレンダーの記録をリセットしますか？")){localStorage.removeItem("ietoreDone");localStorage.removeItem("ietoreStartDate");toast("記録をリセットしました");renderHome()}}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
if("serviceWorker" in navigator){
 navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
 caches?.keys?.().then(keys=>keys.forEach(k=>caches.delete(k)));
}
renderHome();
</script>
</body></html>
